[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
user=root

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:n8n]
command=n8n start
environment=N8N_PORT="5678",N8N_HOST="localhost",N8N_PROTOCOL="http",N8N_EDITOR_BASE_URL="http://localhost:5678/",WEBHOOK_URL="http://localhost:5678/",N8N_SECURE_COOKIE="false",N8N_BASIC_AUTH_ACTIVE="false",N8N_API_KEY_AUTH_DISABLED="true",DB_TYPE="postgresdb",DB_POSTGRESDB_HOST="%(ENV_DB_HOST)s",DB_POSTGRESDB_PORT="%(ENV_DB_PORT)s",DB_POSTGRESDB_DATABASE="%(ENV_DB_DATABASE)s",DB_POSTGRESDB_USER="%(ENV_DB_USERNAME)s",DB_POSTGRESDB_PASSWORD="%(ENV_DB_PASSWORD)s",DB_POSTGRESDB_SCHEMA="n8n",N8N_ENCRYPTION_KEY="%(ENV_N8N_ENCRYPTION_KEY)s"
autostart=false
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=5
startsecs=5

[program:queue-worker]
command=php /app/backend/artisan queue:work database --sleep=3 --tries=3 --timeout=120 --memory=128
directory=/app/backend
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
startsecs=5

[program:rag-reindex]
command=php /app/backend/artisan rag:reindex --delay=1
directory=/app/backend
user=www-data
autostart=true
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
startsecs=0

[program:conversation-purger]
command=/bin/bash -lc "while true; do php /app/backend/artisan conversations:purge --days=${CONVERSATION_RETENTION_DAYS:-3}; sleep 86400; done"
directory=/app/backend
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=45
startsecs=0

[program:n8n-activator]
command=/bin/bash /app/activate-n8n-workflow.sh
autostart=false
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=35
startsecs=0
