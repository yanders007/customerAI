# render.yaml — Infrastructure as Code pour Render.com
# New > Web Service > connecter le repo > Environment: Docker > Dockerfile: ./Dockerfile

services:
  - type: web
    name: support-ia-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free

    envVars:
      - key: APP_NAME
        value: "Support IA"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false           # ⚠️ https://support-ia-backend.onrender.com

      # Supabase PostgreSQL
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false           # ⚠️ db.XXXX.supabase.co
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        sync: false           # ⚠️ Mot de passe Supabase

      # CORS / Frontend
      - key: FRONTEND_URL
        sync: false           # ⚠️ https://support-ia.vercel.app

      # Mail (Brevo — gratuit 300/jour)
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false           # ⚠️ Ton email de compte Brevo
      - key: MAIL_PASSWORD
        sync: false           # ⚠️ Clé SMTP Brevo : dashboard Brevo → SMTP & API → onglet SMTP → Mot de passe SMTP
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false           # ⚠️ Email vérifié sur Brevo
      - key: MAIL_FROM_NAME
        value: "Support IA"
      - key: SUPPORT_EMAIL
        sync: false           # ⚠️ Email qui reçoit les escalades

      # Cohere (embeddings RAG uniquement — gratuit)
      - key: COHERE_API_KEY
        sync: false           # ⚠️ dashboard.cohere.com/api-keys

      # n8n (workflow engine, réutilise la base Supabase ci-dessus)
      - key: N8N_ENCRYPTION_KEY
        generateValue: true   # clé stable pour chiffrer les credentials n8n

      # Drivers Laravel
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: none
      # Purge automatique des conversations : choisir 2 ou 3 jours
      - key: CONVERSATION_RETENTION_DAYS
        value: "3"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      # La clé du provider IA (Gemini, Groq…) se configure
      # depuis l'interface admin — aucune variable d'env requise.
