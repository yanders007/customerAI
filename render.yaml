# render.yaml — Infrastructure as Code pour Render.com
# New > Blueprint dans le dashboard, puis sélectionner ce repo.

services:
  - type: web
    name: support-ia-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free

    envVars:
      - key: APP_NAME
        value: "Support IA"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false           # ⚠️ https://support-ia-backend.onrender.com

      # Supabase PostgreSQL
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false           # ⚠️ db.XXXX.supabase.co
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        sync: false           # ⚠️ Mot de passe Supabase

      # CORS / Frontend
      - key: FRONTEND_URL
        sync: false           # ⚠️ https://support-ia.vercel.app

      # Mail (Resend — gratuit 3000/mois)
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.resend.com
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_USERNAME
        value: resend
      - key: MAIL_PASSWORD
        sync: false           # ⚠️ Clé API Resend (re_xxxxx)
      - key: MAIL_ENCRYPTION
        value: ssl
      - key: MAIL_FROM_ADDRESS
        sync: false           # ⚠️ noreply@tondomaine.com
      - key: MAIL_FROM_NAME
        value: "Support IA"
      - key: SUPPORT_EMAIL
        sync: false           # ⚠️ Email de support

      # Cohere (embeddings RAG)
      - key: COHERE_API_KEY
        sync: false           # ⚠️ dashboard.cohere.com/api-keys (gratuit)

      # Drivers Laravel
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: none
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      # La clé Gemini (et autres providers IA) est configurée
      # directement depuis l'interface admin de l'application.
      # Aucune variable d'env requise pour l'IA.
